# classic-ats — measurements in points (72pt = 1in). A4, 0.65in margins.
page:
  width: 595.276
  height: 841.89
  margin: { top: 44, right: 46, bottom: 44, left: 46 }

color:
  text: "#111111"
  muted: "#444444"
  rule: "#999999"
  link: "#111111"

type:
  family:
    body: "Arimo"
    mono: "Arimo"
    fallback: sans-serif
  weight: { regular: 400, medium: 500, semibold: 600, bold: 700 }
  size:
    name: 18
    contact: 9
    summary: 9.5
    section: 10.5
    body: 9.5
    itemTitle: 9.5
    skillLabel: 9.5
    skillValue: 9.5
    honor: 8.5
  lineHeight: { body: 1.3, heading: 1.2 }

space:
  section: 10
  afterHeaderRule: 4
  headerToRule: 2
  item: 6
  afterItemTitle: 2
  skillRow: 1.5
  bodyInset: 0
  sectionTitleIndent: 0
  afterName: 3
  contactToRule: 0
  afterHeaderBlock: 8

rule: { header: 0.75, section: 0.75 }
honor: { separator: " · " }
bullet: { indent: 13, markerInset: 0, markerSize: 0, markerTop: 0 }
skills: { labelWidth: 0, labelSuffix: ":", separator: ", ", detailSeparator: " " }
text: { align: left, hyphens: false }
