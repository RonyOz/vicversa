# Skill groups are the default rows; applications pick rows and items.
groups:
  - id: languages
    label:
      es: Lenguajes
      en: Languages
  - id: backend
    label:
      es: Backend
      en: Backend
  - id: frontend
    label:
      es: Frontend
      en: Frontend
  - id: cloud
    label:
      es: Nube y DevOps
      en: Cloud & DevOps
  - id: data
    label:
      es: Datos
      en: Data
